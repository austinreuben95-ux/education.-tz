<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Education TZ - Primary School Companion</title>
    <meta name="description" content="A gamified educational platform for Tanzanian primary school students (Grades 1-7) featuring Yun, the AI Tutor. Learn Math, Science, Kiswahili and more." />
    <meta name="theme-color" content="#1eb2a6" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="application-name" content="EduTZ">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    
    <!-- Google Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalApplication",
      "name": "Education TZ",
      "operatingSystem": "Web",
      "applicationCategory": "EducationalApplication",
      "description": "Primary education companion for Tanzania featuring AI tutoring.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "TZS"
      },
      "audience": {
        "@type": "EducationalAudience",
        "educationalRole": "student"
      }
    }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'tz-blue': '#0284c7',
              'tz-yellow': '#f59e0b',
              'tz-green': '#10b981',
              'tz-dark': '#0f172a',
              'tz-purple': '#8b5cf6',
              'tz-indigo': '#6366f1',
              'tz-cyan': '#06b6d4',
              'tz-pink': '#ec4899'
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'Segoe UI', 'Roboto', 'sans-serif']
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 40%, #e0f2fe 100%);
        min-height: 100vh;
        color: #0f172a;
      }
      
      /* Futuristic Glass & Fade Utilities */
      .glass-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.7);
        box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.08);
      }
      
      .glass-card-vibrant {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(240, 249, 255, 0.85) 100%);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(224, 242, 254, 0.8);
        box-shadow: 0 12px 35px -10px rgba(14, 165, 233, 0.12);
      }

      .gradient-text {
        background: linear-gradient(135deg, #4f46e5 0%, #0284c7 50%, #06b6d4 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .gradient-text-warm {
        background: linear-gradient(135deg, #f59e0b 0%, #ec4899 50%, #8b5cf6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .bg-vibrant-gradient {
        background: linear-gradient(135deg, #6366f1 0%, #0284c7 50%, #06b6d4 100%);
      }

      .bg-sunset-gradient {
        background: linear-gradient(135deg, #f59e0b 0%, #ec4899 50%, #8b5cf6 100%);
      }

      .bg-emerald-gradient {
        background: linear-gradient(135deg, #10b981 0%, #059669 50%, #0284c7 100%);
      }

      /* Custom scrollbar */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      
      /* Animations */
      .shake-animation {
        animation: shake 0.5s;
      }
      @keyframes shake {
        0% { transform: translate(1px, 1px) rotate(0deg); }
        10% { transform: translate(-1px, -2px) rotate(-1deg); }
        20% { transform: translate(-3px, 0px) rotate(1deg); }
        30% { transform: translate(3px, 2px) rotate(0deg); }
        40% { transform: translate(1px, -1px) rotate(1deg); }
        50% { transform: translate(-1px, 2px) rotate(-1deg); }
        60% { transform: translate(-3px, 1px) rotate(0deg); }
        70% { transform: translate(3px, 1px) rotate(-1deg); }
        80% { transform: translate(-1px, -1px) rotate(1deg); }
        90% { transform: translate(1px, 2px) rotate(0deg); }
        100% { transform: translate(1px, -2px) rotate(-1deg); }
      }
      
      .animate-fade-in {
        animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(12px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      .animate-fade-in-fast {
        animation: fadeInFast 0.25s ease-out;
      }
      @keyframes fadeInFast {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .animate-pulse-glow {
        animation: pulseGlow 2.5s infinite alternate;
      }
      @keyframes pulseGlow {
        0% { box-shadow: 0 0 15px rgba(99, 102, 241, 0.2); }
        100% { box-shadow: 0 0 30px rgba(6, 182, 212, 0.4); }
      }

      .animate-subtle-pulse {
        animation: subtlePulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes subtlePulse {
        0%, 100% { transform: scale(1); box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.4); }
        50% { transform: scale(1.03); box-shadow: 0 15px 35px -5px rgba(245, 158, 11, 0.7); }
      }
      
      .animate-bounce-short {
        animation: bounceShort 0.5s;
      }
      @keyframes bounceShort {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }

      .animate-slide-in-item {
        animation: slideInItem 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes slideInItem {
        0% { opacity: 0; transform: translateX(-18px) scale(0.92); }
        100% { opacity: 1; transform: translateX(0) scale(1); }
      }

      /* Constant slow-pulsing outer glow animation for Quick Study Button */
      @keyframes constantOuterGlowPulse {
        0%, 100% {
          box-shadow: 0 0 12px 2px rgba(245, 158, 11, 0.5), 0 0 22px 4px rgba(251, 191, 36, 0.3);
        }
        50% {
          box-shadow: 0 0 22px 6px rgba(245, 158, 11, 0.8), 0 0 36px 8px rgba(251, 191, 36, 0.5);
        }
      }

      /* Hover intensified glow */
      @keyframes glowingBorderPulse {
        0%, 100% {
          box-shadow: 0 0 24px 6px rgba(251, 191, 36, 0.85), 0 0 40px 10px rgba(245, 158, 11, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.7);
          border-color: rgba(251, 191, 36, 0.95);
        }
        50% {
          box-shadow: 0 0 44px 12px rgba(245, 158, 11, 0.98), 0 0 60px 16px rgba(253, 224, 71, 0.85), inset 0 0 16px rgba(255, 255, 255, 0.9);
          border-color: rgba(254, 240, 138, 1);
        }
      }

      /* Pop animation for daily mastery count badge */
      @keyframes badgePopMastery {
        0% { transform: scale(0.4) rotate(-15deg); opacity: 0.5; }
        50% { transform: scale(1.6) rotate(15deg); filter: drop-shadow(0 0 14px rgba(251, 191, 36, 1)); }
        75% { transform: scale(0.9) rotate(-5deg); }
        100% { transform: scale(1) rotate(0deg); }
      }

      .animate-badge-pop-mastery {
        animation: badgePopMastery 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      #start-quick-study-session-btn {
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1) !important;
        border: 2px solid transparent;
        animation: constantOuterGlowPulse 2.6s infinite ease-in-out !important;
      }

      #start-quick-study-session-btn:hover {
        animation: glowingBorderPulse 1.2s infinite alternate ease-in-out !important;
      }

      /* Mobile adjustment for #start-quick-study-session-btn (<480px) */
      @media (max-width: 480px) {
        #start-quick-study-session-btn {
          font-size: clamp(0.7rem, 2.5vw + 0.2rem, 0.85rem) !important; /* Responsive font scaling */
          padding: clamp(0.5rem, 2vw + 0.25rem, 0.75rem) clamp(0.75rem, 3.5vw + 0.2rem, 1.25rem) !important; /* Dynamic padding calculation scaling with viewport width */
          display: flex !important;
          align-items: center !important;
          justify-content: center !important;
          text-align: center !important;
          margin-left: auto !important;
          margin-right: auto !important;
          width: 100% !important;
          max-width: 100% !important;
          letter-spacing: 0.02em !important;
        }

        #quick-study-sessions-counter-badge {
          top: clamp(-0.625rem, -1.5vw, -0.375rem) !important;
          right: clamp(-0.625rem, -1.5vw, -0.375rem) !important;
          z-index: 20 !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
